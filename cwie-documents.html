<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>เอกสาร CWIE | มหาวิทยาลัยพะเยา</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing:border-box; }
    :root { color-scheme:light; --canvas:#fcf7ee; --panel:#fffcf7; --ink:#30184a; --muted:#65566e; --line:#e5d9e9; --accent:#552783; --tint:#f0e5f8; --lift-shadow:0 7px 15px rgb(48 24 74 / .12); }
    html[data-theme="dark"] { color-scheme:dark; --canvas:#19151f; --panel:#241c2e; --ink:#f7edf9; --muted:#d4c6dc; --line:#493952; --accent:#e2c8ff; --tint:#382748; --lift-shadow:0 7px 15px rgb(0 0 0 / .28); }
    body { margin:0; background:var(--canvas); color:var(--ink); font:16px/1.6 "IBM Plex Sans Thai",sans-serif; }
    main { max-width:1040px; margin:auto; padding:clamp(24px,6vw,68px) clamp(16px,4vw,40px); }
    a { color:var(--accent); }
    a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    .back { display:inline-flex; align-items:center; min-height:44px; gap:10px; text-decoration:none; font-weight:600; }
    .back { padding-inline:10px; margin-inline-start:-10px; border-radius:9px; }
    header {
      position:relative; isolation:isolate; overflow:hidden; margin:14px 0 24px;
      padding:clamp(24px,5vw,48px); border:1px solid #5c3971; border-radius:22px;
      color:#fff9f0; background:linear-gradient(120deg,#301849,#502d68);
    }
    header::before {
      content:""; position:absolute; z-index:-1; width:17rem; aspect-ratio:1;
      top:-9rem; right:-3rem; border:1px solid #d4ae77;
      border-radius:50%; opacity:.38; box-shadow:0 0 0 26px #e7bd8817,0 0 0 50px #e7bd8810;
    }
    h1,h2,p { margin:0; }
    h1 { font-size:clamp(2rem,6vw,3.5rem); line-height:1.25; margin-bottom:10px; }
    h1::before { content:""; display:block; width:34px; height:3px; margin-bottom:14px; border-radius:3px; background:#e8bf85; }
    header .muted { color:#ebdff4; }
    nav { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
    nav a { display:inline-flex; align-items:center; min-height:44px; padding:6px 16px; border:1px solid var(--line); border-radius:9px; background:var(--panel); text-decoration:none; font-weight:600; }
    nav a[aria-current] { border-color:var(--accent); background:var(--accent); color:var(--panel); }
    @media (hover:hover) {
      .back:hover, nav a:hover { box-shadow:var(--lift-shadow); }
      .back:hover { background:var(--panel); }
      nav a:hover { border-color:transparent; }
    }
    .list { display:grid; gap:10px; margin:0; padding:0; list-style:none; }
    .list li {
      display:grid; grid-template-columns:38px minmax(0,1fr) auto; align-items:center; gap:14px;
      padding:16px clamp(12px,3vw,24px); border:1px solid var(--line); border-radius:13px;
      background:var(--panel); box-shadow:0 3px 12px #3018490b;
    }
    .list li::before {
      content:""; width:18px; height:23px; justify-self:center; border:1.5px solid var(--accent);
      border-radius:3px; background:linear-gradient(var(--accent),var(--accent)) center 8px/8px 1px no-repeat,
        linear-gradient(var(--accent),var(--accent)) center 13px/8px 1px no-repeat, var(--tint);
      box-shadow:0 0 0 6px var(--tint);
    }
    h2 { font-size:1.1rem; overflow-wrap:anywhere; }
    .date,.file { color:var(--muted); font-size:.875rem; }
    .file { background:var(--tint); border-radius:6px; padding:4px 9px; white-space:nowrap; }
    @media(max-width:520px) {
      .list li { grid-template-columns:32px minmax(0,1fr); gap:6px 10px; }
      .list li::before { grid-row:1 / 3; align-self:start; margin-top:8px; }
      .file { grid-column:2; justify-self:start; }
    }
    @keyframes list-enter {
      from { opacity:0; transform:translateY(10px); }
      to { opacity:1; transform:translateY(0); }
    }
    @media(prefers-reduced-motion:no-preference) {
      @view-transition { navigation:auto; }
      .list { view-transition-name:document-list; }
      .list li { animation:list-enter .34s ease-out both; }
      .list li:nth-child(2) { animation-delay:45ms; }
      .list li:nth-child(3) { animation-delay:90ms; }
      .back, nav a { transition:transform .18s ease, box-shadow .2s ease, background-color .18s ease; }
      @media (hover:hover) {
        .back:hover, nav a:hover { transform:translateY(-3px); }
      }
      nav a:active { transform:translateY(1px); }
      ::view-transition-old(root), ::view-transition-new(root) { animation:none; }
      ::view-transition-old(document-list) { animation:.12s ease-in both list-enter reverse; }
      ::view-transition-new(document-list) { animation:.24s ease-out both list-enter; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="cwie-v1.3-minimal.html#documents"><span aria-hidden="true">←</span><span id="back-label">กลับหน้าหลัก CWIE</span></a>
    <header>
      <h1 id="page-title">เอกสาร CWIE</h1>
      <p id="intro" class="muted">รายการตัวอย่าง ยังไม่มีไฟล์ให้ดาวน์โหลด</p>
    </header>
    <nav id="categories" aria-label="ประเภทเอกสาร"></nav>
    <ul class="list" id="document-list" aria-labelledby="page-title"></ul>
  </main>
  <script src="cwie-document-data.js"></script>
  <script>
    const groups = cwieDocumentGroups;
    let english = false;
    try {
      english = localStorage.getItem('cwie-language') === 'en';
      if (localStorage.getItem('cwie-theme') === 'dark') document.documentElement.dataset.theme = 'dark';
    } catch {}
    if (english) {
      document.documentElement.lang = 'en';
      document.getElementById('back-label').textContent = 'Back to CWIE';
      document.getElementById('intro').textContent = 'Sample documents. Downloads are not available yet.';
      document.getElementById('categories').setAttribute('aria-label', 'Document types');
    }
    const requested = new URLSearchParams(location.search).get('type');
    const type = Object.hasOwn(groups, requested) ? requested : 'regulations';
    const title = groups[type].names[Number(english)];
    document.getElementById('page-title').textContent = title;
    document.title = title + ' | CWIE';
    for (const [key, group] of Object.entries(groups)) {
      const link = document.createElement('a');
      link.href = '?type=' + key;
      link.textContent = group.names[Number(english)];
      if (type === key) link.setAttribute('aria-current', 'page');
      document.getElementById('categories').append(link);
    }
    const formatDate = new Intl.DateTimeFormat(english ? 'en-GB' : 'th-TH', {dateStyle:'long',timeZone:'UTC'});
    for (const [date, thai, englishTitle] of [...groups[type].documents].sort((a,b) => b[0].localeCompare(a[0]))) {
      const row = document.createElement('li');
      const info = document.createElement('div');
      const heading = document.createElement('h2');
      heading.textContent = english ? englishTitle : thai;
      const time = document.createElement('time');
      time.className = 'date';
      time.dateTime = date;
      time.textContent = formatDate.format(new Date(date));
      const file = document.createElement('span');
      file.className = 'file';
      file.textContent = english ? 'PDF pending' : 'รอไฟล์ PDF';
      info.append(heading, time);
      row.append(info, file);
      document.getElementById('document-list').append(row);
    }
  </script>
</body>
</html>
